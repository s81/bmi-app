<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BMI Calculator{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  {% block head_extra %}{% endblock %}
  <style>
    :root {
      --navy:     #0A1628;
      --navy2:    #162845;
      --navy3:    #1E3A5F;
      --blue:     #0F6CBD;
      --blue-lt:  #DBEAFE;
      --bg:       #F7F9FC;
      --card:     #FFFFFF;
      --border:   #D9E4F0;
      --text:     #0D1B2E;
      --muted:    #536780;
      --ff-display: 'DM Serif Display', Georgia, serif;
      --ff-body:    'DM Sans', system-ui, sans-serif;
      --ff-mono:    'JetBrains Mono', 'Courier New', monospace;
      --shadow-sm:  0 1px 3px rgba(10,22,40,.07), 0 1px 2px rgba(10,22,40,.05);
      --shadow-md:  0 4px 12px rgba(10,22,40,.10), 0 2px 4px rgba(10,22,40,.06);
      --sidebar-w:  220px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); font-family: var(--ff-body); color: var(--text); }

    /* ── Sidebar ───────────────────────────────────────────────────────── */
    .sidebar {
      position: fixed; top: 0; left: 0;
      width: var(--sidebar-w); height: 100vh;
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%);
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column;
      padding: 1.5rem 0; z-index: 100; overflow-y: auto;
    }
    .sidebar-brand {
      padding: 0 1.25rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 0.75rem;
    }
    .sidebar-brand-label {
      font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; color: #536780; margin: 0 0 0.25rem;
    }
    .sidebar-brand-title {
      font-family: var(--ff-display); font-size: 1.15rem;
      color: #C8D9F0; margin: 0; line-height: 1.2;
    }
    .nav-link {
      display: block;
      padding: 0.45rem 1rem 0.45rem 1.25rem;
      margin: 0 0.75rem 0.15rem 0;
      border-radius: 0 8px 8px 0;
      font-size: 0.875rem; font-weight: 500;
      color: #C8D9F0; text-decoration: none;
      transition: background 0.15s ease;
    }
    .nav-link:hover { background: rgba(15,108,189,0.2); }
    .nav-link.active {
      background: rgba(15,108,189,0.28);
      border-left: 3px solid var(--blue);
      font-weight: 600;
      padding-left: calc(1.25rem - 3px);
    }

    /* ── Main content ──────────────────────────────────────────────────── */
    .main-content {
      margin-left: var(--sidebar-w);
      min-height: 100vh;
      padding: 2.5rem 2rem 4rem;
    }
    .content-inner { max-width: 820px; }

    /* ── Typography ────────────────────────────────────────────────────── */
    h1 {
      font-family: var(--ff-display); font-size: 2.2rem; font-weight: 400;
      color: var(--navy); letter-spacing: -0.01em; line-height: 1.15; margin: 0 0 0.2rem;
    }
    h2 {
      font-family: var(--ff-display); font-size: 1.55rem; font-weight: 400;
      color: var(--navy); margin: 2rem 0 0.5rem;
    }
    hr { border: none; border-top: 1px solid var(--border); margin: 1.75rem 0; }
    p { font-family: var(--ff-body); }

    /* ── Form elements ─────────────────────────────────────────────────── */
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-label {
      font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted);
    }
    input[type="number"], select {
      border: 1.5px solid var(--border); border-radius: 8px;
      font-family: var(--ff-mono); font-size: 1rem; font-weight: 500;
      color: var(--text); background: var(--card);
      padding: 0.5rem 0.75rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      width: 100%;
    }
    input[type="number"]:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(15,108,189,.15);
      outline: none;
    }
    select { font-family: var(--ff-body); }

    /* ── Grids ─────────────────────────────────────────────────────────── */
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* ── Buttons ───────────────────────────────────────────────────────── */
    .btn {
      font-family: var(--ff-body); font-size: 0.92rem; font-weight: 600;
      border-radius: 8px; padding: 0.55rem 1.75rem;
      transition: all 0.15s ease; letter-spacing: 0.01em;
      cursor: pointer; border: none; display: inline-block; text-decoration: none;
    }
    .btn-primary {
      background: var(--blue); color: #fff;
      box-shadow: 0 1px 3px rgba(15,108,189,.3);
    }
    .btn-primary:hover {
      background: #0A5AA8; box-shadow: var(--shadow-md); transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent; color: var(--blue); border: 1.5px solid var(--blue);
    }
    .btn-secondary:hover { background: var(--blue-lt); }

    /* ── Radio group ───────────────────────────────────────────────────── */
    .radio-group { display: flex; gap: 1.5rem; align-items: center; }
    .radio-option {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.88rem; font-weight: 500; color: var(--text); cursor: pointer;
    }
    input[type="radio"] { accent-color: var(--blue); width: 1rem; height: 1rem; }

    /* ── Alerts ────────────────────────────────────────────────────────── */
    .alert {
      border-radius: 8px; padding: 0.75rem 1rem;
      font-size: 0.88rem; margin-bottom: 1rem;
      font-family: var(--ff-body); line-height: 1.5;
    }
    .alert-error  { background:#FEE2E2; border:1px solid #F87171; border-left:4px solid #DC2626; color:#7F1D1D; }
    .alert-warning{ background:#FFF7ED; border:1px solid #FED7AA; border-left:4px solid #F97316; color:#7C2D12; }
    .alert-info   { background:#DBEAFE; border:1px solid #93C5FD; border-left:4px solid #3B82F6; color:#1E3A8A; }

    /* ── Misc ──────────────────────────────────────────────────────────── */
    .caption { font-size: 0.76rem; color: var(--muted); letter-spacing: 0.01em; }
    .chip {
      display: inline-block; background: #EEF3FA; color: #1E3A5F;
      border: 1px solid #D9E4F0; border-radius: 20px;
      padding: 5px 14px; font-size: 0.78rem; font-weight: 600;
    }
    .chips { display: flex; gap: 0.6rem; flex-wrap: wrap; margin: 1.5rem 0 2rem; }

    /* ── Tooltip hint ──────────────────────────────────────────────────── */
    .field-hint {
      font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; line-height: 1.4;
    }

    /* ── Scrollbar ─────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── Mobile ────────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%; height: auto; position: relative;
        flex-direction: row; flex-wrap: wrap;
        padding: 0.75rem 1rem; align-items: center; gap: 0.25rem;
      }
      .sidebar-brand { padding: 0; border: none; margin: 0 auto 0 0; }
      .sidebar-brand-label { display: none; }
      .sidebar-brand-title { font-size: 0.95rem; }
      .nav-link { padding: 0.35rem 0.75rem; margin: 0; border-radius: 6px; }
      .nav-link.active { border-left: none; padding-left: 0.75rem; border-bottom: 2px solid var(--blue); }
      .main-content { margin-left: 0; padding: 1.25rem 1rem 3rem; }
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
      h1 { font-size: 1.75rem; }
      .bmi-hero { flex-direction: column !important; }
    }
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-brand">
    <p class="sidebar-brand-label">Scientific BMI Analysis</p>
    <p class="sidebar-brand-title">BMI<br>Calculator</p>
  </div>
  <a href="{{ url_for('index') }}" class="nav-link{% if request.endpoint == 'index' %} active{% endif %}">Home</a>
  <a href="{{ url_for('calculator') }}" class="nav-link{% if request.endpoint == 'calculator' %} active{% endif %}">Calculator</a>
  <a href="{{ url_for('results') }}" class="nav-link{% if request.endpoint == 'results' %} active{% endif %}">Results</a>
  <a href="{{ url_for('methodology') }}" class="nav-link{% if request.endpoint == 'methodology' %} active{% endif %}">Methodology</a>
</nav>
<div class="main-content">
  <div class="content-inner">
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
